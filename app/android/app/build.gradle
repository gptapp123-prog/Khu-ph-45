plugins { id 'com.android.application' }
def releaseStore = System.getenv('QLKP_ANDROID_KEYSTORE')
def releaseStorePassword = System.getenv('QLKP_ANDROID_STORE_PASSWORD')
def releaseAlias = System.getenv('QLKP_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('QLKP_ANDROID_KEY_PASSWORD')
def releaseSigningReady = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it }
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !releaseSigningReady) {
    throw new GradleException('Bản release cần khóa ký cố định: đặt đủ QLKP_ANDROID_KEYSTORE, QLKP_ANDROID_STORE_PASSWORD, QLKP_ANDROID_KEY_ALIAS, QLKP_ANDROID_KEY_PASSWORD.')
}
android {
    namespace 'vn.quanlykhu.mobile'
    compileSdk 35
    defaultConfig { applicationId 'vn.quanlykhu.mobile'; minSdk 26; targetSdk 34; versionCode 703; versionName '7.3.0-source' }
    signingConfigs {
      if (releaseSigningReady) {
        release {
          storeFile file(releaseStore)
          storePassword releaseStorePassword
          keyAlias releaseAlias
          keyPassword releaseKeyPassword
        }
      }
    }
    buildTypes {
      release {
        minifyEnabled true
        shrinkResources true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        if (releaseSigningReady) signingConfig signingConfigs.release
      }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
