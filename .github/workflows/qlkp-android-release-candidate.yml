name: QLKP Android release candidate build
on:
  workflow_dispatch:
  push:
    branches: [qa/android-release-0215-once-20261116]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build and inspect unsigned release candidate
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p native/android-companion testReleaseUnitTest lintRelease assembleRelease --no-daemon
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p unsigned
          apk=native/android-companion/app/build/outputs/apk/release/app-release-unsigned.apk
          "$tools/aapt" dump badging "$apk" > unsigned/metadata.txt
          grep -q "name='vn.qlkp.companion' versionCode='30' versionName='0.21.5'" unsigned/metadata.txt
          if grep -q 'application-debuggable' unsigned/metadata.txt; then exit 1; fi
          "$tools/zipalign" -P 16 -f 4 "$apk" unsigned/QLKP_Mobile_0.21.5_UNSIGNED.apk
          "$tools/zipalign" -c -P 16 4 unsigned/QLKP_Mobile_0.21.5_UNSIGNED.apk
          cp "$tools/lib/apksigner.jar" unsigned/
          (cd unsigned && sha256sum *.apk *.jar > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: QLKP-Android-0215-unsigned-for-offline-signing
          path: unsigned/
          if-no-files-found: error
          retention-days: 14
