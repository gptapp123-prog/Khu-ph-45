name: KP45 Public Portal E2E

on:
  push:
    paths-ignore:
      - "app/**"
      - ".github/workflows/quan-ly-khu-pho-7-5-ci.yml"
  pull_request:
    paths-ignore:
      - "app/**"
      - ".github/workflows/quan-ly-khu-pho-7-5-ci.yml"
  workflow_dispatch:

concurrency:
  group: kp45-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://khu-pho-45-phuong-binh-tan-iwhddk.v2.appdeploy.ai/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/public.spec.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
