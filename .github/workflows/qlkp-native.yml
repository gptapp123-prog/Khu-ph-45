name: QLKP native Windows and Android installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare installer compiler
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Compile WPF, run isolated self-test, create setup
        run: ./build-on-windows.ps1 -Installer -SmokeTest
      - name: Install, test installed application and uninstall
        run: ./test-windows-install.ps1
      - name: Record pinned SQLite public serialization API
        if: always()
        run: |
          New-Item -ItemType Directory -Force 'build-logs\native-runtime' | Out-Null
          Copy-Item 'build-output\Release\x64\e_sqlite3.dll' 'build-logs\native-runtime\' -ErrorAction Stop
          $dll=Join-Path (Get-Location) 'build-output\Release\x64\System.Data.SQLite.dll'
          if(Test-Path $dll){
            $assembly=[Reflection.Assembly]::LoadFrom($dll)
            $assembly.GetType('System.Data.SQLite.SQLiteConnection').GetMethods() | Where-Object {$_.Name -match 'Serialize|Deserialize|Handle'} | ForEach-Object {$_.ToString()} | Out-File 'build-logs\sqlite-public-api.txt' -Encoding utf8
          }
      - name: Collect test history
        if: always()
        run: |
          $history=Join-Path $env:LOCALAPPDATA 'QLKP-V2-PILOT\test-runs'
          if(Test-Path $history){Copy-Item $history 'build-logs\test-runs' -Recurse -Force}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: QLKP-native-Windows-PILOT-unsigned
          path: |
            native/dist/QLKP-PILOT-SETUP-X64-UNSIGNED.exe
            native/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QLKP-native-Windows-build-evidence
          path: native/build-logs/
          if-no-files-found: warn
          retention-days: 14


  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile, test and lint Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p native/android-companion testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Verify and stage standalone test APK
        run: |
          mkdir -p native/dist/android
          apk=native/android-companion/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging "$apk" > native/dist/android/apk-metadata.txt
          grep -q "name='vn.qlkp.companion.test' versionCode='26' versionName='0.21.0'" native/dist/android/apk-metadata.txt
          "$tools/apksigner" verify --verbose --print-certs "$apk" > native/dist/android/apk-signature.txt
          cp "$apk" native/dist/android/QLKP_Mobile_0.21.0_TEST.apk
          (cd native/dist/android && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: QLKP-native-Android-TEST
          path: native/dist/android/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QLKP-native-Android-test-evidence
          path: |
            native/android-companion/app/build/reports/
            native/android-companion/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
