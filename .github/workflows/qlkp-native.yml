name: QLKP native Windows and Android installers

on:
  workflow_dispatch:
  push:
    branches: [qa/android-0218-fixed-nav-once-20261116]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile, test and lint Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p native/android-companion testDebugUnitTest lintDebug assembleDebug lintRelease assembleRelease --no-daemon
      - name: Verify and stage standalone test APK
        run: |
          mkdir -p native/dist/android
          apk=native/android-companion/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging "$apk" > native/dist/android/apk-metadata.txt
          version=$(sed -n 's/^versionName=//p' native/release.properties)
          code=$(sed -n 's/^versionCode=//p' native/release.properties)
          grep -Fq "name='vn.qlkp.companion.test' versionCode='$code' versionName='$version'" native/dist/android/apk-metadata.txt
          "$tools/apksigner" verify --verbose --print-certs "$apk" > native/dist/android/apk-signature.txt
          cp "$apk" native/dist/android/"QLKP_Mobile_${version}_TEST.apk"
          (cd native/dist/android && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: QLKP-native-Android-TEST
          path: native/dist/android/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QLKP-native-Android-test-evidence
          path: |
            native/android-companion/app/build/reports/
            native/android-companion/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Validate and stage Android release for offline signing
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=native/android-companion/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p native/dist/release-unsigned
          "$tools/aapt" dump badging "$apk" > native/dist/release-unsigned/metadata.txt
          grep -Fq "name='vn.qlkp.companion' versionCode='31' versionName='0.21.8'" native/dist/release-unsigned/metadata.txt
          if grep -q application-debuggable native/dist/release-unsigned/metadata.txt; then exit 1; fi
          "$tools/zipalign" -P 16 -f 4 "$apk" native/dist/release-unsigned/QLKP_Mobile_0.21.8_UNSIGNED.apk
          "$tools/zipalign" -c -P 16 4 native/dist/release-unsigned/QLKP_Mobile_0.21.8_UNSIGNED.apk
          cp "$tools/lib/apksigner.jar" native/dist/release-unsigned/
          (cd native/dist/release-unsigned && sha256sum *.apk *.jar > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: QLKP-Android-0218-unsigned-for-offline-signing
          path: native/dist/release-unsigned/
          if-no-files-found: error
          retention-days: 14
      - name: Android 15 compact UI and rotation smoke test
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
          export ANDROID_USER_HOME="$RUNNER_TEMP/qlkp-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" emulator 'system-images;android-35;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n qlkp_smoke -p "$ANDROID_AVD_HOME/qlkp_smoke.avd" -k 'system-images;android-35;google_apis;x86_64' -f
          if ! test -f "$ANDROID_AVD_HOME/qlkp_smoke.ini" && test -f "$ANDROID_AVD_HOME/qlkp_smoke.avd/config.ini"; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/qlkp_smoke.avd" > "$ANDROID_AVD_HOME/qlkp_smoke.ini"
          fi
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx qlkp_smoke
          QLKP_SMOKE_APP=vn.qlkp.companion.test QLKP_SMOKE_APK=native/android-companion/app/build/outputs/apk/debug/app-debug.apk python native/tools/android_device_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QLKP-Android-0218-device-evidence
          path: native/build-logs/android/
          if-no-files-found: warn
          retention-days: 14
