name: KP45 Authenticated E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'e2e/authenticated-live.spec.ts'
      - '.github/workflows/authenticated-e2e.yml'
  pull_request:
    paths:
      - 'e2e/authenticated-live.spec.ts'
      - '.github/workflows/authenticated-e2e.yml'

permissions:
  contents: read

jobs:
  authenticated-e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://khu-pho-45-phuong-binh-tan-iwhddk.v2.appdeploy.ai/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run authenticated tests
        run: npx playwright test e2e/authenticated-live.spec.ts --project=chromium-desktop
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
