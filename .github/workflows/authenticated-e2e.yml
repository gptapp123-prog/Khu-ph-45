name: KP45 Authenticated E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'e2e/authenticated-live.spec.ts'
      - '.github/workflows/authenticated-e2e.yml'
  pull_request:
    paths:
      - 'e2e/authenticated-live.spec.ts'
      - '.github/workflows/authenticated-e2e.yml'

permissions:
  contents: read

jobs:
  authenticated-e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://khu-pho-45-phuong-binh-tan-iwhddk.v2.appdeploy.ai/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Restore authenticated browser state
        shell: bash
        run: |
          if [ -z "${{ secrets.E2E_STORAGE_STATE_B64 }}" ]; then
            echo "AUTH_STATE_MISSING: configure E2E_STORAGE_STATE_B64 from a real Google session"
            exit 20
          fi
          mkdir -p playwright/.auth
          printf '%s' "${{ secrets.E2E_STORAGE_STATE_B64 }}" | base64 --decode > playwright/.auth/user.json || { echo "AUTH_STATE_INVALID_BASE64"; exit 21; }
          node -e "const fs=require('fs');const p='playwright/.auth/user.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));if(!Array.isArray(x.cookies)||!Array.isArray(x.origins))process.exit(22);"
      - name: Run authenticated tests
        run: npx playwright test e2e/authenticated-live.spec.ts --project=chromium-desktop
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
