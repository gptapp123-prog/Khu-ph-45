name: Quan Ly Khu Pho 7.5 CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/quan-ly-khu-pho-7-5-ci.yml"
  push:
    branches:
      - "codex/quan-ly-khu-pho-7.5"
    paths:
      - "app/**"
      - ".github/workflows/quan-ly-khu-pho-7-5-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python and JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        env:
          PYTHONPATH: pc
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q pc

      - name: Check JavaScript syntax
        run: |
          node --check pc/web/app.js
          node --check pc/web/framework.js
