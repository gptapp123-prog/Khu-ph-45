name: Quan Ly Khu Pho 7.5 CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/quan-ly-khu-pho-7-5-ci.yml"
  push:
    branches:
      - "codex/quan-ly-khu-pho-7.5"
    paths:
      - "app/**"
      - ".github/workflows/quan-ly-khu-pho-7-5-ci.yml"

concurrency:
  group: quan-ly-khu-pho-7-5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python and JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        env:
          PYTHONPATH: pc
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q pc
      - name: Check JavaScript syntax
        run: |
          node --check pc/web/app.js
          node --check pc/web/framework.js

  browser-e2e:
    name: Desktop and mobile browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Start ephemeral app
        run: |
          PYTHONPATH=app/pc python app/tests/e2e_server.py > /tmp/quanlykp-e2e.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/quanlykp-e2e.log
          exit 1
      - name: Run responsive browser tests
        run: npx playwright test --config=app/e2e/playwright.config.ts
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quan-ly-khu-pho-7-5-e2e
          path: |
            playwright-report-qlkp/
            app/e2e/test-results/
            test-results/
            /tmp/quanlykp-e2e.log
          retention-days: 14
