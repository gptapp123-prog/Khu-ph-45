name: Build application installers

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/build-installers.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"
          choco install innosetup -y --no-progress
          choco install tesseract -y --no-progress
      - name: Build desktop executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --console --name QuanLyKhuPho --icon pc/web/QuanLyKhuPho.ico --paths pc --add-data "pc/web;web" --add-data "pc/ocr_models;ocr_models" --collect-all zxingcpp --collect-all pypdfium2 pc/launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/QuanLyKhuPho/QuanLyKhuPho.exe)) { throw "Missing executable" }
          if (!(Test-Path dist/QuanLyKhuPho/_internal/ocr_models/vie.traineddata)) { throw "Missing Vietnamese OCR model" }
          $ocrSource = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (!(Test-Path (Join-Path $ocrSource 'tesseract.exe'))) { throw "Missing Tesseract executable" }
          Copy-Item $ocrSource dist/QuanLyKhuPho/tesseract -Recurse
          & dist/QuanLyKhuPho/tesseract/tesseract.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled OCR engine failed" }
          & dist/QuanLyKhuPho/QuanLyKhuPho.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Frozen application failed to start" }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc packaging/QuanLyKhuPho.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist_installer/QuanLyKhuPho_PC_7_5_6_Setup.exe)) { throw "Missing installer" }
          $installDir = Join-Path $env:RUNNER_TEMP 'QLKP-Install-Smoke'
          $setup = (Resolve-Path dist_installer/QuanLyKhuPho_PC_7_5_6_Setup.exe).Path
          $result = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/NORESTART', "/DIR=$installDir") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          & (Join-Path $installDir 'QuanLyKhuPho.exe') --help
          if ($LASTEXITCODE -ne 0) { throw "Installed application failed to start" }
          & (Join-Path $installDir 'tesseract/tesseract.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "Installed OCR engine failed to start" }
          & (Join-Path $installDir 'QuanLyKhuPho.exe') --check-install
          if ($LASTEXITCODE -ne 0) { throw "Installed OCR pipeline failed" }
          Get-FileHash dist_installer/QuanLyKhuPho_PC_7_5_6_Setup.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: QuanLyKhuPho-PC-7.5.6-unsigned
          path: app/dist_installer/QuanLyKhuPho_PC_7_5_6_Setup.exe
          if-no-files-found: error
          retention-days: 14

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android test APK
        run: gradle -p app/android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: QuanLyKhuPho-Android-debug-not-release
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-offline-signing-input:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build unsigned release for offline signing
        run: gradle -p app/android assembleRelease -PqlkpUnsignedForOfflineSigning=true --no-daemon
      - name: Align APK and include signing verifier
        shell: bash
        run: |
          set -euo pipefail
          tool="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name zipalign -type f | sort -V | tail -1)"
          test -n "$tool"
          input=app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$input"
          mkdir -p app/android/offline-signing
          "$tool" -f 4 "$input" app/android/offline-signing/app-release-aligned-unsigned.apk
          cp "$(dirname "$tool")/lib/apksigner.jar" app/android/offline-signing/apksigner.jar
          java -jar app/android/offline-signing/apksigner.jar --version
      - uses: actions/upload-artifact@v4
        with:
          name: QuanLyKhuPho-Android-offline-signing-input
          path: app/android/offline-signing/
          if-no-files-found: error
          retention-days: 3
